# This is a basic workflow to help you get started with Actions
name: CI

# Controls when the workflow will run
on:
  push:
  pull_request:
    branches: [ main ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  pre_job:
    # continue-on-error: true # Uncomment once integration is finished
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: 'never'
          skip_after_successful_duplicate: 'true'
          paths_ignore: '["**/README.md"]'
          do_not_skip: '["pull_request", "workflow_dispatch"]'

  ############################################################################
  # Building RoboTool plug-ins with Maven.
  ############################################################################
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    if: needs.pre_job.outputs.should_skip != 'true'
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    permissions:
      contents: write
      packages: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.ROBOSTAR_GITHUB_ACTIONS_TOKEN }}

      - name: List tests
        run: |
          ls -R robochart-csp-gen/circus.robocalc.robochart.generator.csp.tests/robochart-tests
        
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Cache Maven repository
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.m2/repository
          key: maven-filtered-cache-${{ hashFiles('**/pom.xml') }}
          
      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Get current time
        id: time
        uses: Kaven-Universe/github-action-current-date-time@v1
        with:
          format: "YYYYMMDDHHMM"

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Set RoboTool version for release
        id: version
        run: |
          echo "version=${{steps.tag_version.outputs.new_version}}.${{steps.time.outputs.time}}" >> $GITHUB_OUTPUT

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Set Maven package versions
        id: maven-version
        run: |
          echo "Version to be released: ${{ steps.version.outputs.version }}"
          mvn org.eclipse.tycho:tycho-versions-plugin:set-version -Dtycho.version=2.7.5 -Dtycho-version=2.7.5 ${{ steps.cache.outputs.cache-hit == 'true' && '-o' || '' }} -DnewVersion="${{ steps.version.outputs.version }}" -Dartifacts="robostar.robotool.customization.feature,robostar.robotool.product.standalone,robostar.robotool.customization.repository,robostar.robotool.customization"
  
      - name: Build RoboTool (core) with Maven
        run: |
          mvn -Dtycho.version=2.7.5 \
              -Dtycho-version=2.7.5 \
              -Dmaven.wagon.http.retryHandler.count=5 \
              -Dmaven.wagon.http.connectionTimeout=120000 \
              -Dmaven.wagon.http.readTimeout=120000 \
              -Declipse.p2.mirrors=false ${{ steps.cache.outputs.cache-hit == 'true' && '-o' || '' }} \
              install -P core --file pom.xml

      - name: Build RoboSim (physmod) and RoboTool product with Maven
        run: |
          mvn -Dtycho.version=2.7.5 \
              -Dtycho-version=2.7.5 \
              -Dmaven.wagon.http.retryHandler.count=5 \
              -Dmaven.wagon.http.connectionTimeout=120000 \
              -Dmaven.wagon.http.readTimeout=120000 \
              -Declipse.p2.mirrors=false ${{ steps.cache.outputs.cache-hit == 'true' && '-o' || '' }} \
              install -P physmod,product --file pom.xml
 
      # Remove unwanted things from cache.
      - name: Save filtered Maven cache
        run: |
          rm -rf ~/.m2/repository/circus
          rm -rf ~/.m2/repository/robostar
          find ~/.m2/repository -name "*.lastUpdated" -delete

      - name: List P2 unit versions
        run: ./robotool-product/target/products/robotool.product/linux/gtk/x86_64/eclipse -application org.eclipse.equinox.p2.director -repository file:`realpath robotool-product/target/repository/` -list -lf "\${id} | \${version}" | grep -E '(circus\.|robostar|sirius|rcp)' | grep -v 'jar' > versions.md

      - name: Store robochart-csp-gen
        uses: actions/upload-artifact@v4
        with:
          name: robochart-csp-gen
          include-hidden-files: true
          path: |
            robochart-csp-gen/run-tests.py
            robochart-csp-gen/circus.robocalc.robochart.generator.csp.tests/
            robochart-csp-gen/circus.robocalc.robochart.generator.csp/target/robochart.jar
          retention-days: 1
          overwrite: true

      - name: Store robochart-prism-gen
        uses: actions/upload-artifact@v4
        with:
          name: robochart-prism-gen
          include-hidden-files: true
          path: |
            robochart-prism-gen/run-tests.py
            robochart-prism-gen/circus.robocalc.robochart.generator.prism.tests/
            robochart-prism-gen/circus.robocalc.robochart.generator.prism/target/robochart_prism.jar
          retention-days: 1
          overwrite: true

      - name: Store robosim-csp-gen
        uses: actions/upload-artifact@v4
        with:
          name: robosim-csp-gen
          include-hidden-files: true
          path: |
            robosim-csp-gen/run-tests.py
            robosim-csp-gen/circus.robocalc.robosim.generator.csp.tests/
            robosim-csp-gen/circus.robocalc.robosim.generator.csp/target/robosim.jar
          retention-days: 1
          overwrite: true

      # We only need to do the below if deploying. Can avoid it if we're just testing, for example.
      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Store copy of metamodels
        run: |
          mkdir -p robotool-repository/target/repository/metamodels
          cp robochart-metamodel/circus.robocalc.robochart/model/robochart.ecore robotool-repository/target/repository/metamodels/
          cp robosim-metamodel/circus.robocalc.robosim/model/robosim.ecore robotool-repository/target/repository/metamodels/
          cp prism-metamodel/circus.robocalc.robosim/model/prism.ecore robotool-repository/target/repository/metamodels/
      
      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Store robotool-repository
        uses: actions/upload-artifact@v4
        with:
          name: robotool-repository
          path: robotool-repository/target/repository/
          retention-days: 1
          overwrite: true

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Store robotool-product
        uses: actions/upload-artifact@v4
        with:
          name: robotool-product
          path: |
            robotool-product/target/products/*.zip
            versions.md
          retention-days: 1
          overwrite: true

  ############################################################################
  # Testing of RoboChart CSP generator
  ############################################################################
  test-robochart-csp-gen:
    needs: build
    runs-on: robostarservice
    permissions:
      contents: write
      packages: write
    container: 
      image: ghcr.io/uoy-robostar/robotool-dev-docker:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: '11'

      - name: Download robochart-csp-gen
        uses: actions/download-artifact@v4
        with:
          name: robochart-csp-gen
          
      - name: Get FDR4 license
        uses: UoY-RoboStar/ga-activate-fdr@master
        with:
          name: 'RoboTool'
          email: 'robotool@gmail.com'

      - name: List and generate AutonomousChemicalDetector
        run: |
          ls -l circus.robocalc.robochart.generator.csp.tests/robochart-tests/robochart/AutonomousChemicalDetector
          java -jar circus.robocalc.robochart.generator.csp/target/robochart.jar true true circus.robocalc.robochart.generator.csp.tests/robochart-tests/robochart/AutonomousChemicalDetector

      - name: Run FDR tests [default configuration]
        run: python3 run-tests.py -m -p

      - name: Collect markdown output
        run: cat output.md >> summary.md

      # Same as above but with iteration and assertion compression on
      - name: Run FDR tests [with compressions on]
        run: python3 run-tests.py -m -p --iteratedComp --assertionComp

      - name: Collect markdown output
        run: cat output.md >> summary.md

      - name: Create commit comment
        uses: peter-evans/commit-comment@v3
        with:
          body-path: ./summary.md

      - name: Delete robochart-csp-gen artifact
        uses: geekyeggo/delete-artifact@v5
        with:
            name: robochart-csp-gen
            failOnError: false

  ############################################################################
  # Testing of RoboSim CSP generator
  ############################################################################
  test-robosim-csp-gen:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    container: 
      image: ghcr.io/uoy-robostar/robotool-dev-docker:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: '11'

      - name: Download robosim-csp-gen
        uses: actions/download-artifact@v4
        with:
          name: robosim-csp-gen

      - name: Get FDR4 license
        uses: UoY-RoboStar/ga-activate-fdr@master
        with:
          name: 'RoboTool'
          email: 'robotool@gmail.com'

      # Assertion compression on
      - name: Run FDR tests [default configuration with assertion compressions]
        run: python3 run-tests.py -m -p --assertionComp

      - name: Collect markdown output
        run: cat output.md >> summary.md

      # Same as above but with iteration and assertion compression on
      - name: Run FDR tests [with compressions on]
        run: python3 run-tests.py -m -p --iteratedComp --assertionComp

      - name: Collect markdown output
        run: cat output.md >> summary.md

      - name: Create commit comment
        uses: peter-evans/commit-comment@v3
        with:
          body-path: ./summary.md

      - name: Delete robosim-csp-gen artifact
        uses: geekyeggo/delete-artifact@v5
        with:
            name: robosim-csp-gen
            failOnError: false  

  ############################################################################
  # Testing of RoboChart PRISM generator
  ############################################################################
  test-robochart-prism-gen:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    container: 
      image: ghcr.io/uoy-robostar/robotool-dev-docker:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: '11'

      - name: Download robochart-prism-gen
        uses: actions/download-artifact@v4
        with:
          name: robochart-prism-gen

      - name: Run PRISM tests
        run: python3 run-tests.py -m

      - name: Create commit comment
        uses: peter-evans/commit-comment@v3
        with:
          body-path: ./output.md

      - name: Delete robochart-prism-gen artifact
        uses: geekyeggo/delete-artifact@v5
        with:
            name: robochart-prism-gen
            failOnError: false  

  ############################################################################
  # Deployment of RoboTool repository
  ############################################################################
  deploy-repository:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [build, test-robochart-csp-gen, test-robosim-csp-gen, test-robochart-prism-gen]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download robotool-repository
        uses: actions/download-artifact@v4
        with:
          name: robotool-repository
          path: robotool-repository

      - name: List files
        run: ls -R

      - name: Deploying repository
        run: echo ${{needs.build.outputs.version}}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.1
        with:
          # Private key required to access the host
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: echo "${ROBOSTAR_WEB_HOST} ${ROBOSTAR_WEB_SSH_FINGERPRINT_TYPE} ${ROBOSTAR_WEB_SSH_FINGERPRINT}" >> ~/.ssh/known_hosts
        env:
          ROBOSTAR_WEB_HOST: ${{ secrets.ROBOSTAR_WEB_HOST }}
          ROBOSTAR_WEB_SSH_FINGERPRINT: ${{ secrets.ROBOSTAR_WEB_SSH_FINGERPRINT }}
          ROBOSTAR_WEB_SSH_FINGERPRINT_TYPE: ${{ secrets.ROBOSTAR_WEB_SSH_FINGERPRINT_TYPE }}

      - id: deploy
        name: Deploy
        uses: UoY-RoboStar/ga-eclipse-deploy@override-version
        with:
          remote-host: ${{ secrets.ROBOSTAR_WEB_HOST }}
          remote-user: ${{ secrets.ROBOSTAR_WEB_USER }}
          remote-root: ${{ secrets.ROBOSTAR_WEB_ROOT }}
          remote-baseurl: 'https://robostar.cs.york.ac.uk'
          remote-relative-path: 'robotool/stable/'
          version: ${{ needs.build.outputs.version }}
          maven-target: 'robotool-repository/'

      - name: Create commit comment
        uses: peter-evans/commit-comment@v1
        with:
          body: 'Successfully deployed at: https://robostar.cs.york.ac.uk/robotool/stable/${{ steps.deploy.outputs.dest }}'

      - name: Delete robotool-repository artifact
        uses: geekyeggo/delete-artifact@v5
        with:
            name: robotool-repository
            failOnError: false

  ############################################################################
  # Deployment and release of RoboTool product on GitHub Releases
  ############################################################################
  deploy-product:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [build, test-robochart-csp-gen, test-robosim-csp-gen, test-robochart-prism-gen]
    permissions:
      pull-requests: read
      contents: write
      packages: write
    steps:
      - name: Download robotool-product
        uses: actions/download-artifact@v4
        with:
          name: robotool-product

      - name: List files
        run: ls -R
    
      - name: Deploying
        run: |
          echo "Version: ${{ needs.build.outputs.version }}"
     
      - name: Read repository versions
        id: versions
        uses: juliangruber/read-file-action@v1
        with:
          path: ./versions.md

      - name: "Build Changelog"
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.new_tag }}
          body: |
            RoboTool version ${{ needs.build.outputs.version }} compiled and packaged as an Eclipse product using Eclipse tycho's Maven builder. 

            Note that binaries are not signed. In particular, when downloaded and extracted under macOS may need [dequarantining](https://superuser.com/questions/526920/how-to-remove-quarantine-from-file-permissions-in-os-x) using the command `xattr -d com.apple.quarantine Eclipse.app` to avoid a message saying that the binary is damaged.

            ## Changelog
            ${{ needs.build.outputs.changelog }}
            ${{ steps.build_changelog.outputs.changelog }}

            ## Feature versions
            <details>
            <summary>Main feature versions</summary>
            
            Feature | Version
            --------|--------
            ${{ steps.versions.outputs.content }}
            
            </details>
          files: |
            robotool-product/target/products/*.tar.gz
            robotool-product/target/products/*.zip
          draft: false
          prerelease: false
          make_latest: true

      - name: Delete robotool-product artifact
        uses: geekyeggo/delete-artifact@v5
        with:
            name: robotool-product
            failOnError: false

  ############################################################################
  # Cleaning up of artifacts from GitHub build
  ############################################################################
  cleanup:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, test-robochart-csp-gen, test-robosim-csp-gen, test-robochart-prism-gen, deploy-product, deploy-repository]
    steps:
      # - name: Delete robochart-csp-gen artifact
      #   uses: geekyeggo/delete-artifact@v5
      #   with:
      #       name: robochart-csp-gen
      #       failOnError: false

      - name: Delete robosim-csp-gen artifact
        uses: geekyeggo/delete-artifact@v5
        with:
            name: robosim-csp-gen
            failOnError: false

      - name: Delete robosim-csp-gen artifact
        uses: geekyeggo/delete-artifact@v5
        with:
            name: robochart-prism-gen
            failOnError: false
    
      - name: Delete robotool-repository artifact
        uses: geekyeggo/delete-artifact@v5
        with:
            name: robotool-repository
            failOnError: false
    
      - name: Delete robotool-product artifact
        uses: geekyeggo/delete-artifact@v5
        with:
            name: robotool-product
            failOnError: false
   
